<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="876" viewBox="0 0 1600 876" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Prompting architecture</title>
  <desc id="desc">Interfaces reach shared application services directly through Next.js browser routes and the trusted local Fastify API, or through toolkits used by the Core Agent and external coding agents over MCP. Web search is an optional Core Agent capability. Prompt tools edit database-backed prompt content rather than host files. The four conceptual modules cover Prompt, Target, Evaluation, and Criteria. Target pins prompt revisions; Evaluation judges target outputs using Criteria. Evaluation is requested explicitly or configured in a scenario plan, and recorded turns can be scored without running the target again. Storage, authentication, and internal workflow wiring are omitted from this capability overview.</desc>

