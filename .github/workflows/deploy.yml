# Builds and releases the public main branch to the existing Singapore Cloud Run service without stored cloud credentials.

name: Deploy to Singapore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vibe-prompting-production
  cancel-in-progress: false

env:
  IMAGE: asia-southeast1-docker.pkg.dev/api-test-466606/vibe-prompting/vibe-prompting
  PROJECT_ID: api-test-466606
  REGION: asia-southeast1
  SERVICE: vibe-prompting

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release
        uses: actions/checkout@v5

      - name: Build the verified workspace image
        run: docker build --tag "${IMAGE}:${GITHUB_SHA}" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account: vibe-prompting-deploy@api-test-466606.iam.gserviceaccount.com
          workload_identity_provider: projects/337332892316/locations/global/workloadIdentityPools/vibe-prompting-github/providers/github

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Publish the image
        run: docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy the existing service
        run: >-
          gcloud run deploy "${SERVICE}"
          --project "${PROJECT_ID}"
          --region "${REGION}"
          --platform managed
          --image "${IMAGE}:${GITHUB_SHA}"
          --quiet
