<!-- Owns the temporary browser interface for configuring and reviewing evaluation runs without introducing a frontend framework. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe Prompting Evaluator</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --accent: #2859d6;
        --accent-hover: #2149b4;
        --background: #f5f6f8;
        --border: #dedfe3;
        --border-strong: #b9bbc2;
        --danger: #a32626;
        --muted: #64666d;
        --soft-accent: #eef2ff;
        --subtle: #f7f7f8;
        --surface: #fff;
        --text: #17181b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background: var(--background);
        color: var(--text);
        line-height: 1.5;
      }
      main {
        width: min(1180px, calc(100% - 48px));
        margin: 0 auto;
        padding: 38px 0 64px;
      }
      header {
        margin-bottom: 26px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 8px;
        font-size: clamp(1.8rem, 3vw, 2.25rem);
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      h2 {
        margin-bottom: 0;
        font-size: 1.15rem;
      }
      h3 {
        margin-bottom: 12px;
        font-size: 1rem;
      }
      p {
        max-width: 68ch;
        color: var(--muted);
        line-height: 1.55;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 560px) minmax(0, 1fr);
        align-items: start;
        gap: 20px;
      }
      form,
      .results {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgb(24 24 27 / 4%);
      }
      form {
        display: grid;
        gap: 24px;
        padding: 24px;
      }
      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend,
      .field-label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.82rem;
        font-weight: 680;
      }
      .models {
        display: grid;
        gap: 22px;
      }
      .helper {
        margin: -2px 0 10px;
        font-size: 0.82rem;
      }
      select,
      textarea,
      input,
      button {
        font: inherit;
      }
      select,
      textarea,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        transition:
          border-color 140ms ease,
          box-shadow 140ms ease;
      }
      select,
      input[type="text"],
      input[type="number"] {
        min-height: 44px;
        padding: 0 12px;
      }
      textarea {
        min-height: 104px;
        padding: 12px;
        resize: vertical;
        line-height: 1.5;
      }
      select:hover,
      textarea:hover,
      input[type="text"]:hover,
      input[type="number"]:hover {
        border-color: #92949b;
      }
      select:focus-visible,
      textarea:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent);
        outline-offset: 2px;
      }
      .judge-models {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .checkbox {
        display: flex;
        min-height: 44px;
        align-items: center;
        gap: 9px;
        padding: 10px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.86rem;
        line-height: 1.3;
        transition:
          border-color 140ms ease,
          background 140ms ease;
      }
      .checkbox:hover {
        border-color: var(--border-strong);
        background: var(--subtle);
      }
      .checkbox:has(input:checked) {
        border-color: var(--accent);
        background: var(--soft-accent);
      }
      .checkbox input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--accent);
      }
      .criteria-heading,
      .criterion-heading,
      .criterion-controls,
      .section-heading,
      .evaluation-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .criteria-heading .helper {
        margin: 0;
      }
      .criteria-list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .criterion {
        display: grid;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--subtle);
      }
      .criterion-title {
        font-size: 0.92rem;
        font-weight: 750;
      }
      .criterion-type {
        width: auto;
        min-width: 150px;
      }
      .criterion-instruction-input {
        min-height: 88px;
      }
      .criterion-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .criterion-options:empty {
        display: none;
      }
      button {
        width: auto;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 680;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          color 140ms ease,
          transform 80ms ease;
      }
      button:hover:not(:disabled) {
        border-color: var(--border-strong);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .primary {
        min-height: 46px;
        background: var(--accent);
        color: #fff;
      }
      .primary:hover:not(:disabled) {
        border-color: transparent;
        background: var(--accent-hover);
      }
      .secondary {
        border-color: var(--border);
        background: #fff;
        color: var(--text);
      }
      .secondary:hover:not(:disabled) {
        background: var(--subtle);
      }
      .remove {
        min-height: 32px;
        padding: 0 8px;
        background: transparent;
        color: var(--danger);
        font-size: 0.82rem;
      }
      .remove:hover:not(:disabled) {
        border-color: transparent;
        background: #fbecec;
      }
      .remove:disabled {
        cursor: default;
        opacity: 0.35;
      }
      .results {
        min-height: 286px;
        padding: 24px;
      }
      .section-heading {
        margin-bottom: 16px;
      }
      .summary {
        color: var(--muted);
        font-size: 0.82rem;
      }
      .empty,
      .status {
        display: grid;
        min-height: 208px;
        place-items: center;
        padding: 28px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        color: var(--muted);
        text-align: center;
      }
      .status.error {
        border-color: #d9a2a2;
        background: #fff6f6;
        color: var(--danger);
      }
      .result-case + .result-case {
        margin-top: 28px;
        padding-top: 28px;
        border-top: 1px solid var(--border);
      }
      .output {
        margin: 0;
        padding: 16px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--subtle);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.88rem;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .evaluations {
        margin-top: 18px;
        border-top: 1px solid var(--border);
      }
      .evaluation {
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
      }
      .evaluation-heading {
        align-items: flex-start;
      }
      .criterion-instruction {
        margin: 0;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 650;
      }
      .value {
        flex: 0 0 auto;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--soft-accent);
        color: #153d9a;
        font-size: 0.8rem;
        font-weight: 750;
      }
      .meta,
      .comment,
      .evidence {
        margin: 8px 0 0;
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .meta {
        color: var(--muted);
      }
      .evidence {
        padding-left: 20px;
      }
      @media (max-width: 960px) {
        main {
          width: min(900px, calc(100% - 32px));
        }
        .workspace {
          grid-template-columns: 1fr;
        }
        .results {
          min-height: 0;
        }
      }
      @media (max-width: 700px) {
        main {
          width: min(100% - 24px, 900px);
          padding-top: 24px;
        }
        form,
        .results {
          padding: 18px;
        }
        .criterion-options {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 460px) {
        .judge-models {
          grid-template-columns: 1fr;
        }
        .criterion-heading {
          align-items: stretch;
          flex-direction: column;
        }
        .criterion-controls {
          align-items: stretch;
        }
        .criterion-type {
          min-width: 0;
          width: 100%;
        }
        .evaluation-heading {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Vibe Prompting</h1>
        <!-- prettier-ignore -->
        <p>Run one prompt through a target model, evaluate it with one or more judge models, and compare any number of criteria.</p>
      </header>
      <div class="workspace">
        <form id="evaluation-form">
          <div class="models">
            <label>
              <span class="field-label">Target model</span>
              <select id="target-model" required></select>
            </label>
            <fieldset>
              <legend>Judge models</legend>
              <p class="helper">Select one or more models.</p>
              <div class="judge-models" id="judge-models"></div>
            </fieldset>
          </div>
          <label>
            <span class="field-label">Prompt</span>
            <!-- prettier-ignore -->
            <textarea id="prompt" required>Explain why the sky appears blue in two concise sentences.</textarea>
          </label>
          <fieldset>
            <legend>Criteria</legend>
            <div class="criteria-heading">
              <p class="helper">Add as many checks as this run needs.</p>
              <button class="secondary" id="add-criterion" type="button">Add criterion</button>
            </div>
            <div class="criteria-list" id="criteria"></div>
          </fieldset>
          <button class="primary" disabled id="submit" type="submit">Loading models…</button>
        </form>
        <section class="results" aria-live="polite">
          <div class="section-heading">
            <h2>Result</h2>
            <span class="summary" id="result-summary"></span>
          </div>
          <div id="result">
            <div class="empty">Results will appear here after an evaluation.</div>
          </div>
        </section>
      </div>
    </main>
    <script>
      const form = document.querySelector("#evaluation-form");
      const submit = document.querySelector("#submit");
      const result = document.querySelector("#result");
      const resultSummary = document.querySelector("#result-summary");
      const targetModel = document.querySelector("#target-model");
      const judgeModels = document.querySelector("#judge-models");
      const criteria = document.querySelector("#criteria");
      const addCriterionButton = document.querySelector("#add-criterion");
      let criterionId = 0;

      function createElement(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function showStatus(message, isError = false) {
        resultSummary.textContent = "";
        const status = createElement("div", isError ? "status error" : "status", message);
        if (isError) status.setAttribute("role", "alert");
        result.replaceChildren(status);
      }

      function addModels(models) {
        targetModel.replaceChildren();
        judgeModels.replaceChildren();
        models.forEach((model, index) => {
          const option = createElement("option", "", model.label + " (" + model.id + ")");
          option.value = model.id;
          targetModel.append(option);

          const label = createElement("label", "checkbox");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = "judge-model";
          checkbox.value = model.id;
          checkbox.checked = index === (models.length > 1 ? 1 : 0);
          label.append(checkbox, createElement("span", "", model.label));
          judgeModels.append(label);
        });
      }

      async function loadModels() {
        const response = await fetch("/api/config");
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "Unable to load model configuration.");
        if (!Array.isArray(body.models) || body.models.length === 0)
          throw new Error("No models are configured.");
        addModels(body.models);
      }

      function renderCriterionOptions(criterion) {
        const type = criterion.querySelector(".criterion-type").value;
        const options = criterion.querySelector(".criterion-options");
        options.replaceChildren();
        if (type === "categorical") {
          const label = createElement("label");
          label.append(createElement("span", "field-label", "Categories"));
          const input = document.createElement("input");
          input.className = "criterion-categories";
          input.type = "text";
          input.required = true;
          input.placeholder = "excellent, acceptable, poor";
          label.append(input);
          options.append(label);
        }
        if (type === "numeric") {
          for (const [name, value] of [
            ["Minimum", "0"],
            ["Maximum", "10"],
          ]) {
            const label = createElement("label");
            label.append(createElement("span", "field-label", name));
            const input = document.createElement("input");
            input.className = name === "Minimum" ? "criterion-min" : "criterion-max";
            input.type = "number";
            input.required = true;
            input.value = value;
            label.append(input);
            options.append(label);
          }
        }
      }

      function updateCriterionNumbers() {
        const items = [...criteria.querySelectorAll(".criterion")];
        items.forEach((criterion, index) => {
          criterion.querySelector(".criterion-title").textContent = "Criterion " + (index + 1);
          criterion.querySelector(".remove").disabled = items.length === 1;
        });
      }

      function addCriterion(defaults = {}) {
        criterionId += 1;
        const criterion = createElement("div", "criterion");
        criterion.dataset.criterionId = String(criterionId);
        const heading = createElement("div", "criterion-heading");
        const title = createElement("span", "criterion-title");
        const controls = createElement("div", "criterion-controls");
        const type = document.createElement("select");
        type.className = "criterion-type";
        type.setAttribute("aria-label", "Criterion type");
        for (const [value, label] of [
          ["boolean", "Boolean"],
          ["categorical", "Categorical"],
          ["numeric", "Numeric"],
          ["text", "Text"],
          ["correction", "Correction"],
        ]) {
          const option = createElement("option", "", label);
          option.value = value;
          type.append(option);
        }
        type.value = defaults.type || "boolean";
        const remove = createElement("button", "remove", "Remove");
        remove.type = "button";
        remove.addEventListener("click", () => {
          criterion.remove();
          updateCriterionNumbers();
        });
        controls.append(type, remove);
        heading.append(title, controls);

        const instructionLabel = createElement("label");
        instructionLabel.append(createElement("span", "field-label", "Instruction"));
        const instruction = document.createElement("textarea");
        instruction.className = "criterion-instruction-input";
        instruction.required = true;
        instruction.value =
          defaults.instruction ??
          "The response must be scientifically accurate and directly answer the question.";
        instructionLabel.append(instruction);

        const options = createElement("div", "criterion-options");
        criterion.append(heading, instructionLabel, options);
        type.addEventListener("change", () => renderCriterionOptions(criterion));
        criteria.append(criterion);
        renderCriterionOptions(criterion);
        updateCriterionNumbers();
      }

      function readCriterion(criterion) {
        const type = criterion.querySelector(".criterion-type").value;
        const value = {
          type,
          instruction: criterion.querySelector(".criterion-instruction-input").value,
        };
        if (type === "categorical") {
          value.categories = criterion
            .querySelector(".criterion-categories")
            .value.split(",")
            .map((category) => category.trim())
            .filter(Boolean);
        }
        if (type === "numeric") {
          value.min = Number(criterion.querySelector(".criterion-min").value);
          value.max = Number(criterion.querySelector(".criterion-max").value);
        }
        return value;
      }

      function renderResult(body) {
        const cases = Array.isArray(body.cases) ? body.cases : [];
        result.replaceChildren();
        resultSummary.textContent = cases.length + (cases.length === 1 ? " case" : " cases");
        if (cases.length === 0) {
          result.append(
            createElement("div", "empty", "The evaluation completed without case results."),
          );
          return;
        }
        cases.forEach((item, caseIndex) => {
          const article = createElement("article", "result-case");
          article.append(createElement("h3", "", "Case " + (caseIndex + 1) + " output"));
          const output = createElement("pre", "output");
          output.textContent =
            typeof item.output === "string" ? item.output : JSON.stringify(item.output, null, 2);
          article.append(output);
          const evaluations = createElement("div", "evaluations");
          for (const evaluation of item.evaluations || []) {
            const section = createElement("section", "evaluation");
            const heading = createElement("div", "evaluation-heading");
            const instruction = evaluation.criterion?.instruction || "Criterion";
            heading.append(createElement("p", "criterion-instruction", instruction));
            heading.append(createElement("span", "value", String(evaluation.value)));
            section.append(heading);
            section.append(createElement("p", "meta", "Judge: " + evaluation.judge));
            if (evaluation.comment)
              section.append(createElement("p", "comment", evaluation.comment));
            if (Array.isArray(evaluation.evidence) && evaluation.evidence.length > 0) {
              const evidence = createElement("ul", "evidence");
              evaluation.evidence.forEach((item) => evidence.append(createElement("li", "", item)));
              section.append(evidence);
            }
            evaluations.append(section);
          }
          if (evaluations.childElementCount > 0) article.append(evaluations);
          result.append(article);
        });
      }

      addCriterionButton.addEventListener("click", () => addCriterion({ instruction: "" }));
      addCriterion();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const judges = [...judgeModels.querySelectorAll("input:checked")].map(({ value }) => value);
        if (judges.length === 0) {
          showStatus("Select at least one judge model before running the evaluation.", true);
          return;
        }
        submit.disabled = true;
        submit.textContent = "Evaluating…";
        result.setAttribute("aria-busy", "true");
        showStatus("Running the target model and judges…");
        try {
          const response = await fetch("/api/evaluate", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              targetModel: targetModel.value,
              judges,
              cases: [
                {
                  input: document.querySelector("#prompt").value,
                  criteria: [...criteria.querySelectorAll(".criterion")].map(readCriterion),
                },
              ],
            }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.error || "Evaluation failed.");
          renderResult(body);
        } catch (error) {
          showStatus(error instanceof Error ? error.message : String(error), true);
        } finally {
          submit.disabled = false;
          submit.textContent = "Run evaluation";
          result.removeAttribute("aria-busy");
        }
      });

      loadModels()
        .then(() => {
          submit.disabled = false;
          submit.textContent = "Run evaluation";
        })
        .catch((error) => showStatus(error instanceof Error ? error.message : String(error), true));
    </script>
  </body>
</html>
